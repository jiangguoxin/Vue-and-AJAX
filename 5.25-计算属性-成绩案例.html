<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>成绩案例</title>
    <style>
        .app {
            display: flex;
            gap: 50px;
            margin: 50px auto;
            width: 800px;
        }

        /* 左侧表格样式 */
        .table-area {
            flex: 2;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: center;
        }

        th,
        td {
            border: 1px solid #ddd;
            padding: 10px;
        }

        th {
            background-color: #f7f7f7;
            font-weight: normal;
        }

        .red {
            color: red;
        }

        a {
            color: #1765a2;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        /* 右侧表单样式 */
        .form-area {
            flex: 1;
            padding-top: 10px;
        }

        .form-item {
            margin-bottom: 20px;
            display: flex;
            align-items: center;
        }

        .form-item label {
            width: 50px;
            font-size: 14px;
        }

        .form-item input {
            flex: 1;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            outline: none;
        }

        .btn-add {
            background-color: #1a73e8;
            color: #fff;
            border: none;
            padding: 8px 20px;
            border-radius: 4px;
            cursor: pointer;
            margin-left: 50px;
        }

        .btn-add:hover {
            background-color: #155cb0;
        }

        .summary span {
            margin: 0 15px;
        }
    </style>
</head>

<body>
    <div id="app" class="app">
        <!-- 左侧表格区域 -->
        <div class="table-area">
            <table>
                <thead>
                    <tr>
                        <th>编号</th>
                        <th>科目</th>
                        <th>成绩</th>
                        <th>操作</th>
                    </tr>
                </thead>


                <tbody v-if="list.length > 0">
                    <tr v-for="(item,index) in list">
                        <td>{{index + 1}}</td>
                        <td>{{item.subject}}</td>
                        <td :class="{red:item.score < 60}">{{item.score}}</td>
                        <td><a @click.prevent="del(item.id)" href="#">删除</a></td>
                    </tr>
                </tbody>


                <tbody v-else>
                    <tr>
                        <td colspan="4">暂无数据</td>
                    </tr>
                </tbody>

                <tfoot>
                    <tr>
                        <td colspan="4" class="summary">
                            <span>总分：{{totalScore}}</span>
                            <span>平均分：{{averageScore}}</span>
                        </td>
                    </tr>
                </tfoot>
            </table>
        </div>

        <!-- 右侧表单区域 -->
        <div class="form-area">
            <div class="form-item">
                <label>科目：</label>
                <input v-model.trim="subject" type="text" placeholder="请输入科目">
            </div>
            <div class="form-item">
                <label>分数：</label>
                <input v-model.number="score" type="text" placeholder="请输入分数">
            </div>
            <button @click="add" class="btn-add">添加</button>
        </div>
    </div>

    <script src="./Vue.js"></script>
    <script>
        // Vue 实例代码写在这里
        const app = new Vue({
            el: '#app',
            data: {
                subject: '',
                score: '',
                // 定义数据属性
                list: [
                    { id: 1, subject: '语文', score: 55 },
                    { id: 2, subject: '英语', score: 80 },
                    { id: 3, subject: '数学', score: 100 },
                ]
            },
            methods: {
                // 定义方法
                del(id) {
                    this.list = this.list.filter(item => item.id !== id)
                },
                add() {
                    if (!this.subject) {
                        alert('请输入科目')
                        return
                    }
                    if (typeof this.score !== 'number'){
                        alert('请输入正确的成绩')
                        return
                    }
                        this.list.unshift({
                            id: +new Date(),
                            subject: this.subject,
                            score: this.score,
                        }),
                            this.subject = '',
                            this.score = ''
                }
            },
            computed:{
                totalScore(){
                    return this.list.reduce((sum,item)=>sum + item.score,0)
                },
                averageScore(){
                    if(this.list.length === 0) return 0
                    return (this.totalScore/this.list.length).toFixed(2)
                }
            },
        });
    </script>
</body>

</html>
