<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box {
            width: 300px;
            border: 2px solid #000;
            padding: 20px;
            margin: 20px;
        }

        .box h3 {
            margin-top: 0;
            margin-bottom: 20px;
            font-size: 18px;
        }

        .item {
            margin-bottom: 15px;
            font-size: 14px;
        }

        .item input[type="text"] {
            width: 150px;
        }

        .item textarea {
            width: 100%;
            height: 80px;
            margin-top: 10px;
            box-sizing: border-box;
            resize: none;
        }

        button {
            padding: 5px 15px;
        }
    </style>
</head>

<body>
    <!-- 
    v-model应用于其他表单元素：
        textarea/checkbox/radio/select
    -->

    <div id="app" class="box">
        <h3>小黑学习网</h3>
        <div class="item">
            姓名：<input type="text" v-model="username">
        </div>
        <div class="item">
            是否单身：<input type="checkbox" v-model="isSingle">
        </div>
        <div class="item">
            性别：
            <label><input type="radio" name="gender" value="1" v-model="gender">男</label> <!-- value的作用是提交给后台的数据-->
            <label><input type="radio" name="gender" value="2" v-model="gender">女</label>
        </div>
        <div class="item">
            所在城市：
            <select v-model="cityId">
                <option value="101">北京</option>
                <option value="102">上海</option>
                <option value="103">广州</option>
                <option value="104">深圳</option>
            </select>
        </div>
        <div class="item">
            自我描述：
            <textarea></textarea>
        </div>
        <button>立即注册</button>
    </div>

    <script src="./Vue.js">
    </script>

    <script>
        const app = new Vue({
            el: '#app',
            data: {
                username: '',
                isSingle: false,
                gender: '1',
                cityId: '102'
            }
        })
    </script>
</body>

</html>

<!-- 
单选框的小知识：使用name可以将元素分到一组，从而实现单选框只能选一个
-->
