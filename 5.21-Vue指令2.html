<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div id="app">
        <!-- 以后都推荐@ -->
        <button @click = 'count++'>+</button>
        {{count}}
        <button @click = 'count--'>-</button>
    </div>
    <div id="app2">
        <p v-show = 'flag'>{{msg}}</p>
        <button @click = 'fn'>点击切换显示隐藏</button>
    </div>
    <!-- 
    v-on:注册事件 = 添加监听 + 提供处理逻辑 
    @+事件名称 = v-on:事件名称
    -->
    <script src="./Vue.js">
    </script>

    <script>
        const app = new Vue({
            el: '#app',
            data: {
                count: 100
            }
        })
        const app1 = new Vue({
            el:'#app2',
            data:{
                msg:'hahahahahaha',
                flag: true
            },
            methods:{
                fn(){
                    this.flag = !this.flag
                }

            }
        })
    </script>
</body>
</html>
