<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div id="app" v-html="msg">
        {{msg}}
    </div>
    

    <!-- v-html:设置元素的innerHTML -->
     <script src="./Vue.js">
     </script>

     <script>
        const app = new Vue({
            el:'#app',
            data: {
                msg:`
                <a href="https://www.baidu.com">
                    百度一下，你就知道
                </a>
                `
            }
        })
     </script>
</body>
</html>
